<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Massive Satellite Tracker (14,000+ Objects)</title>
  
  <!-- CesiumJS -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  
  <!-- Satellite.js (SGP4 propagator) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/5.0.0/satellite.min.js"></script>
  
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background: #000; }
    #cesiumContainer { width: 100%; height: 100%; }
    
    #overlay {
      position: absolute;
      top: 15px; left: 15px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      padding: 15px 20px;
      border-radius: 8px;
      color: white;
      z-index: 10;
      backdrop-filter: blur(8px);
      min-width: 250px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    
    h1 { margin: 0 0 5px 0; font-size: 16px; color: #38bdf8; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    p { margin: 5px 0; font-size: 13px; color: #94a3b8; }
    .stat { font-family: monospace; font-size: 18px; color: #4ade80; font-weight: bold; }
    
    #loading {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #38bdf8;
      font-size: 24px;
      font-weight: bold;
      background: rgba(0,0,0,0.8);
      padding: 20px 40px;
      border-radius: 10px;
      border: 1px solid #38bdf8;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div id="loading">📡 FETCHING 14,000+ ORBITAL ELEMENTS...</div>
  
  <div id="overlay">
    <h1>🛰️ Massive Space Tracker</h1>
    <p>Tracking full CelesTrak active catalog</p>
    <div style="margin-top: 15px;">
      <p>Active Objects Rendered:</p>
      <div class="stat" id="statCount">0</div>
    </div>
  </div>
  
  <div id="cesiumContainer"></div>
  
  <script src="massive-app.js"></script>
</body>
</html>
